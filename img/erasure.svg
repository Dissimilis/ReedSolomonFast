<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b8f96"/>
    </marker>
  </defs>

  <!-- Row 1: encode -->
  <text x="20" y="46" fill="#8b8f96" font-size="13">Encode</text>
  <g transform="translate(120,24)">
    <rect x="0"   y="0" width="52" height="40" rx="6" fill="#4c8bf5"/>
    <rect x="62"  y="0" width="52" height="40" rx="6" fill="#4c8bf5"/>
    <rect x="124" y="0" width="52" height="40" rx="6" fill="#4c8bf5"/>
    <rect x="186" y="0" width="52" height="40" rx="6" fill="#4c8bf5"/>
    <text x="26"  y="25" text-anchor="middle" fill="#fff" font-weight="600">D1</text>
    <text x="88"  y="25" text-anchor="middle" fill="#fff" font-weight="600">D2</text>
    <text x="150" y="25" text-anchor="middle" fill="#fff" font-weight="600">D3</text>
    <text x="212" y="25" text-anchor="middle" fill="#fff" font-weight="600">D4</text>
    <line x1="256" y1="20" x2="304" y2="20" stroke="#8b8f96" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="320" y="0" width="52" height="40" rx="6" fill="#f0a030"/>
    <rect x="382" y="0" width="52" height="40" rx="6" fill="#f0a030"/>
    <text x="346" y="25" text-anchor="middle" fill="#fff" font-weight="600">P1</text>
    <text x="408" y="25" text-anchor="middle" fill="#fff" font-weight="600">P2</text>
    <text x="470" y="25" fill="#8b8f96">4 data shards + 2 parity shards</text>
  </g>

  <!-- Row 2: lose any two -->
  <text x="20" y="146" fill="#8b8f96" font-size="13">Lose any two</text>
  <g transform="translate(120,124)">
    <rect x="0"   y="0" width="52" height="40" rx="6" fill="#4c8bf5"/>
    <rect x="62"  y="0" width="52" height="40" rx="6" fill="none" stroke="#8b8f96" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="124" y="0" width="52" height="40" rx="6" fill="#4c8bf5"/>
    <rect x="186" y="0" width="52" height="40" rx="6" fill="#4c8bf5"/>
    <rect x="320" y="0" width="52" height="40" rx="6" fill="#f0a030"/>
    <rect x="382" y="0" width="52" height="40" rx="6" fill="none" stroke="#8b8f96" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="26"  y="25" text-anchor="middle" fill="#fff" font-weight="600">D1</text>
    <text x="150" y="25" text-anchor="middle" fill="#fff" font-weight="600">D3</text>
    <text x="212" y="25" text-anchor="middle" fill="#fff" font-weight="600">D4</text>
    <text x="346" y="25" text-anchor="middle" fill="#fff" font-weight="600">P1</text>
    <path d="M78,10 L98,30 M98,10 L78,30" stroke="#d9534f" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M398,10 L418,30 M418,10 L398,30" stroke="#d9534f" stroke-width="2.5" stroke-linecap="round"/>
    <text x="470" y="25" fill="#8b8f96">any 4 of the 6 are enough</text>
  </g>

  <!-- Arrow down -->
  <line x1="239" y1="176" x2="239" y2="214" stroke="#8b8f96" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="252" y="200" fill="#8b8f96" font-size="13">Reconstruct</text>

  <!-- Row 3: rebuilt -->
  <text x="20" y="266" fill="#8b8f96" font-size="13">Rebuilt</text>
  <g transform="translate(120,244)">
    <rect x="0"   y="0" width="52" height="40" rx="6" fill="#4c8bf5"/>
    <rect x="62"  y="0" width="52" height="40" rx="6" fill="#4c8bf5"/>
    <rect x="124" y="0" width="52" height="40" rx="6" fill="#4c8bf5"/>
    <rect x="186" y="0" width="52" height="40" rx="6" fill="#4c8bf5"/>
    <rect x="320" y="0" width="52" height="40" rx="6" fill="#f0a030"/>
    <rect x="382" y="0" width="52" height="40" rx="6" fill="#f0a030"/>
    <text x="26"  y="25" text-anchor="middle" fill="#fff" font-weight="600">D1</text>
    <text x="88"  y="25" text-anchor="middle" fill="#fff" font-weight="600">D2</text>
    <text x="150" y="25" text-anchor="middle" fill="#fff" font-weight="600">D3</text>
    <text x="212" y="25" text-anchor="middle" fill="#fff" font-weight="600">D4</text>
    <text x="346" y="25" text-anchor="middle" fill="#fff" font-weight="600">P1</text>
    <text x="408" y="25" text-anchor="middle" fill="#fff" font-weight="600">P2</text>
    <text x="470" y="25" fill="#8b8f96">the file is back, byte for byte</text>
  </g>
</svg>
