name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
        filter: tree:0

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        global-json-file: global.json
        cache: false

    - name: Restore
      run: dotnet restore ReedSolomonFast.sln

    - name: Build
      run: dotnet build ReedSolomonFast.sln -c Release --no-restore

    - name: Test
      run: dotnet test src/ReedSolomonFast.Tests -c Release --no-build --blame-hang-timeout 120s

    - name: Pack
      run: dotnet pack src/ReedSolomonFast -c Release --no-build --output ./nupkgs

    - name: Check that the package version is the release tag
      run: |
        set -e
        tag="${{ github.event.release.tag_name }}"
        case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "tag '$tag' is not vX.Y.Z"; exit 1;; esac
        ls ./nupkgs/ReedSolomonFast.${tag#v}.nupkg

    - name: Push to NuGet
      run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
